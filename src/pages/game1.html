<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/game1.css">
    <title>Papier, Kamień, Nożyce</title>
</head>

<body>
    <header class="header">
        <nav class="header__menu menu">
            <ul class="menu__list">
                <li class="list__item"><a class="list__item-link" href="./index.html">Powrót do menu</a></li>
            </ul>
        </nav>
    </header>

    <main class="game">
        <div class="game__computer">
            <img id="computer-choice" src="../paper.png" alt="computer_choice">
        </div>
        <div class="game__control" id="game-control">
            <button class="control__button control__button--rock" data-symbol="rock" aria-label="rock"></button>
            <button class="control__button control__button--scissor" data-symbol="scissor"
                aria-label="scissor"></button>
            <button class="control__button control__button--paper" data-symbol="paper" aria-label="paper"></button>
        </div>
    </main>
    <script src="../scripts/game1.js"></script>
</body>

</html>
